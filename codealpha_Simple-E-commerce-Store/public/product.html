<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <title>Product Details</title>
</head>
<body>
  <nav><a href="index.html"><h1>My Shop</h1></a><a href="cart.html">Cart</a></nav>
  <div class="container" id="product-detail"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    fetch(`/api/products/${productId}`)
      .then(res => res.json())
      .then(p => {
        document.getElementById('product-detail').innerHTML = `
          <div style="display: flex; gap: 40px; background: white; padding: 30px; border-radius: 8px;">
            <img src="${p.image}" style="max-width: 400px; border-radius: 8px;">
            <div>
              <h2>${p.name}</h2>
              <h3 style="color: #28a745; margin: 15px 0;">$${p.price.toFixed(2)}</h3>
              <p>${p.description}</p>
              <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">Add to Cart</button>
            </div>
          </div>
        `;
      });

    function addToCart(id, name, price) {
      let cart = JSON.all = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item.id === id);
      if (existing) { existing.quantity += 1; } 
      else { cart.push({ id, name, price, quantity: 1 }); }
      localStorage.setItem('cart', JSON.stringify(cart));
      alert('Added to cart!');
    }
  </script>
</body>
</html>
