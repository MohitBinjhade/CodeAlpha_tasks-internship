<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <title>Your Cart</title>
</head>
<body>
  <nav><a href="index.html"><h1>My Shop</h1></a><a href="index.html">Continue Shopping</a></nav>
  <div class="container">
    <h2>Your Shopping Cart</h2><br>
    <div id="cart-items"></div>
    <h3 id="cart-total" style="text-align: right; margin-top: 20px;">Total: $0.00</h3>
    <button id="checkout-btn" style="float: right; margin-top: 10px;">Place Order</button>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const container = document.getElementById('cart-items');
    let total = 0;

    if(cart.length === 0) {
      container.innerHTML = '<p>Your cart is empty.</p>';
    } else {
      container.innerHTML = cart.map(item => {
        total += item.price * item.quantity;
        return `
          <div class="cart-item">
            <div><h4>${item.name}</h4><p>Qty: ${item.quantity}</p></div>
            <p>$${(item.price * item.quantity).toFixed(2)}</p>
          </div>
        `;
      }).join('');
    }
    document.getElementById('cart-total').innerText = `Total: $${total.toFixed(2)}`;

    document.getElementById('checkout-btn').addEventListener('click', () => {
      const user = localStorage.getItem('user');
      if (!user) {
        alert('Please log in to place an order.');
        window.location.href = 'auth.html';
        return;
      }
      if (cart.length === 0) return alert('Your cart is empty');

      fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_email: user, total, items: cart })
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          alert('Order placed successfully!');
          localStorage.removeItem('cart');
          window.location.href = 'index.html';
        }
      });
    });
  </script>
</body>
</html>
