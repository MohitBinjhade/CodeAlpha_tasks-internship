<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <title>Login / Register</title>
</head>
<body>
  <nav><a href="index.html"><h1>My Shop</h1></a></nav>
  <div class="container" style="max-width: 400px; background: white; padding: 30px; border-radius: 8px; margin-top: 50px;">
    <h2 id="auth-title">Login</h2>
    <form id="auth-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="submit-btn" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
      <a href="#" id="toggle-auth">Don't have an account? Register here.</a>
    </p>
  </div>

  <script>
    let isLogin = true;
    const toggleBtn = document.getElementById('toggle-auth');
    const formTitle = document.getElementById('auth-title');
    const submitBtn = document.getElementById('submit-btn');

    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isLogin = !isLogin;
      formTitle.innerText = isLogin ? 'Login' : 'Register';
      submitBtn.innerText = isLogin ? 'Login' : 'Register';
      toggleBtn.innerText = isLogin ? "Don't have an account? Register here." : "Already have an account? Login here.";
    });

    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const endpoint = isLogin ? '/api/login' : '/api/register';

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          if (isLogin) {
            localStorage.setItem('user', data.email);
            window.location.href = 'index.html';
          } else {
            alert('Registered successfully! Now logging you in...');
            isLogin = true;
            toggleBtn.click();
          }
        } else {
          alert(data.message);
        }
      });
    });
  </script>
</body>
</html>
